
name: Qwen API Test

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qwen-api-test
  cancel-in-progress: true

jobs:
  test:
    name: Qwen API Validation
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      PORT: "3265"
      PUPPETEER_SKIP_DOWNLOAD: "true"
      LOG_LEVEL: "warn"

    defaults:
      run:
        working-directory: qwen-api

    steps:
      - name: Checkout QwenFreeApi
        uses: actions/checkout@v4
        with:
          repository: angyedz/QwenFreeApi
          path: qwen-api
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Chromium with Playwright
        shell: bash
        run: |
          set -euo pipefail

          echo "Installing Playwright..."

          npm install --no-save --no-audit --no-fund playwright

          echo "Installing Chromium and system dependencies..."

          npx playwright install --with-deps chromium

          echo "Chromium installation completed."

      - name: Verify Chromium
        shell: bash
        run: |
          set -euo pipefail

          node <<'NODE'
          const { chromium } = require('playwright');

          async function main() {
            const browser = await chromium.launch({
              headless: true
            });

            const page = await browser.newPage();

            await page.goto('about:blank');

            console.log('Chromium launched successfully.');
            console.log('Browser version:', browser.version());

            await browser.close();
          }

          main().catch(error => {
            console.error('Chromium verification failed:', error.message);
            process.exitCode = 1;
          });
          NODE

      - name: Check project files
        shell: bash
        run: |
          set -euo pipefail

          for file in package.json server.js src/account-store.js; do
            if [ ! -f "$file" ]; then
              echo "::error::Missing required file: $file"
              exit 1
            fi
          done

          echo "QwenFreeApi project found."

      - name: Install project dependencies
        run: npm install --no-audit --no-fund

      - name: Validate JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail

          node --check server.js

          for dir in src scripts public; do
            if [ -d "$dir" ]; then
              while IFS= read -r -d '' file; do
                echo "Checking: $file"
                node --check "$file"
              done < <(find "$dir" -type f -name '*.js' -print0)
            fi
          done

          echo "JavaScript syntax validation passed."

      - name: Run offline tests
        run: npm test

      - name: Configure Qwen account
        shell: bash
        env:
          JWT: ${{ secrets.JWT }}
        run: |
          set -euo pipefail

          if [ -z "${JWT:-}" ]; then
            echo "::error::GitHub secret JWT is missing."
            exit 1
          fi

          node <<'NODE'
          const accountStore = require('./src/account-store');

          const token = process.env.JWT;

          if (!token || token.trim().length < 20) {
            console.error('JWT secret is missing or invalid.');
            process.exit(1);
          }

          accountStore.save({
            token,
            email: 'github-actions',
            cookie: [],
            savedAt: Date.now(),
            failures: 0,
            unavailableUntil: 0,
            lastError: ''
          }, 'github-actions');

          console.log('Qwen account configured successfully.');
          NODE

      - name: Start Qwen API server
        shell: bash
        env:
          QWEN_WORKSPACE: ${{ runner.temp }}/qwen-workspace
        run: |
          set -euo pipefail

          mkdir -p "$QWEN_WORKSPACE"

          LOG_FILE="$RUNNER_TEMP/qwen-server.log"
          PID_FILE="$RUNNER_TEMP/qwen-server.pid"

          touch "$LOG_FILE"

          node server.js >> "$LOG_FILE" 2>&1 &
          SERVER_PID=$!

          echo "$SERVER_PID" > "$PID_FILE"

          echo "Qwen API server started."
          echo "PID: $SERVER_PID"

      - name: Wait for server
        shell: bash
        run: |
          set -euo pipefail

          URL="http://127.0.0.1:${PORT}/healthz"

          for attempt in $(seq 1 40); do
            if curl --silent --fail "$URL" > "$RUNNER_TEMP/health.json"; then
              echo "Server is responding."
              cat "$RUNNER_TEMP/health.json"
              exit 0
            fi

            if ! kill -0 "$(cat "$RUNNER_TEMP/qwen-server.pid")" 2>/dev/null; then
              echo "::error::Qwen server exited unexpectedly."
              exit 1
            fi

            sleep 2
          done

          echo "::error::Server startup timed out."
          exit 1

      - name: Test API endpoints
        shell: bash
        run: |
          set -euo pipefail

          node <<'NODE'
          const BASE = `http://127.0.0.1:${process.env.PORT}`;

          async function request(path, options = {}) {
            const response = await fetch(`${BASE}${path}`, {
              ...options,
              signal: AbortSignal.timeout(60000)
            });

            const body = await response.text();

            let data;

            try {
              data = JSON.parse(body);
            } catch {
              data = null;
            }

            if (!response.ok) {
              const message = body.toLowerCase();

              if (
                message.includes('captcha') ||
                message.includes('waf') ||
                message.includes('x5secdata') ||
                message.includes('punish')
              ) {
                throw new Error(
                  `${path}: Qwen upstream returned a CAPTCHA/WAF challenge.`
                );
              }

              throw new Error(`${path}: HTTP ${response.status}`);
            }

            return data;
          }

          async function main() {
            console.log('Testing /healthz ...');

            const healthz = await request('/healthz');

            if (healthz?.ok !== true) {
              throw new Error('/healthz returned an unhealthy status.');
            }

            if (healthz.account !== 'loaded') {
              throw new Error('Qwen account was not loaded.');
            }

            console.log('Health check passed.');

            console.log('Testing /health ...');

            const health = await request('/health');

            if (
              health?.ok !== true ||
              health.account !== 'loaded'
            ) {
              throw new Error('/health check failed.');
            }

            console.log('Detailed health check passed.');

            console.log('Testing /v1/models ...');

            const models = await request('/v1/models');

            if (
              !Array.isArray(models?.data) ||
              models.data.length === 0
            ) {
              throw new Error('No models returned by the API.');
            }

            const model = models.data.find(
              item => item.id === 'qwen3.8-max'
            );

            if (!model) {
              throw new Error('Expected model qwen3.8-max was not found.');
            }

            console.log(
              `Models endpoint passed (${models.data.length} models).`
            );

            console.log('Testing /v1/chat/completions ...');

            const chat = await request('/v1/chat/completions', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'Authorization': 'Bearer local'
              },
              body: JSON.stringify({
                model: 'qwen3.8-max',
                messages: [
                  {
                    role: 'user',
                    content: 'Reply with exactly: QWEN_OK'
                  }
                ],
                stream: false,
                temperature: 0
              })
            });

            const content = chat?.choices?.[0]?.message?.content;

            if (
              typeof content !== 'string' ||
              content.trim().length === 0
            ) {
              throw new Error('Chat API returned an empty response.');
            }

            console.log('Chat completion passed.');
            console.log('All API tests passed.');
          }

          main().catch(error => {
            console.error(`TEST FAILED: ${error.message}`);
            process.exitCode = 1;
          });
          NODE

      - name: Stop Qwen server
        if: always()
        shell: bash
        run: |
          set +e

          PID_FILE="$RUNNER_TEMP/qwen-server.pid"

          if [ -f "$PID_FILE" ]; then
            SERVER_PID="$(cat "$PID_FILE")"

            if kill -0 "$SERVER_PID" 2>/dev/null; then
              echo "Stopping Qwen server: $SERVER_PID"
              kill "$SERVER_PID"
            fi
          fi

          echo "Server shutdown step completed."

      - name: Display complete server logs
        if: always()
        shell: bash
        run: |
          LOG_FILE="$RUNNER_TEMP/qwen-server.log"

          echo "=========================================="
          echo "       COMPLETE QWEN SERVER LOGS"
          echo "=========================================="

          if [ -f "$LOG_FILE" ]; then
            cat "$LOG_FILE"

            echo
            echo "=========================================="
            echo "Total log lines: $(wc -l < "$LOG_FILE")"
            echo "=========================================="
          else
            echo "Server log file was not created."
          fi

      - name: Upload server logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qwen-server-logs
          path: ${{ runner.temp }}/qwen-server.log
          if-no-files-found: warn
          retention-days: 7
