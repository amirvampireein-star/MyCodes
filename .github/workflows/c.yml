
name: Ubuntu RDP with bore (Auto-Update README)

on:
  workflow_dispatch:
    inputs:
      session_minutes:
        description: 'Duration in minutes'
        required: true
        default: '120'

permissions:
  contents: write

concurrency:
  group: ubuntu-rdp-session
  cancel-in-progress: true

jobs:
  rdp-tunnel:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      DEBIAN_FRONTEND: noninteractive

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # 2. INSTALL XFCE AND XRDP
      # ============================================================

      - name: Install XFCE and XRDP
        shell: bash
        env:
          OPENCODE_BASIC_USER: ${{ secrets.OPENCODE_BASIC_USER }}
          OPENCODE_BASIC_PASS: ${{ secrets.OPENCODE_BASIC_PASS }}
          SESSION_MINUTES: ${{ github.event.inputs.session_minutes }}

        run: |
          set -Eeuo pipefail

          echo "Updating Ubuntu packages..."

          if ! [[ "$SESSION_MINUTES" =~ ^[0-9]+$ ]] ||
             (( SESSION_MINUTES < 1 || SESSION_MINUTES > 330 )); then
            echo "ERROR: Invalid session duration."
            exit 1
          fi

          USERNAME="$OPENCODE_BASIC_USER"
          PASSWORD="$OPENCODE_BASIC_PASS"

          if [ -z "$USERNAME" ] || [ -z "$PASSWORD" ]; then
            echo "ERROR: Missing RDP credentials."
            exit 1
          fi

          sudo apt-get update -qq

          sudo apt-get install -y \
            xfce4 \
            xfce4-goodies \
            xfce4-session \
            xfconf \
            xfce4-settings \
            xfce4-panel \
            xfdesktop4 \
            xfwm4 \
            thunar \
            xrdp \
            xorgxrdp \
            xserver-xorg-core \
            dbus \
            dbus-x11 \
            dbus-user-session \
            xauth \
            x11-xserver-utils \
            xterm \
            curl \
            wget \
            ca-certificates \
            python3 \
            tar \
            gzip

          echo "Package installation completed."

          # Validate executable commands.
          for BIN in \
            startxfce4 \
            xfce4-session \
            xfconf-query \
            dbus-run-session \
            Xorg \
            xfwm4 \
            xfce4-panel \
            xfdesktop; do

            if ! command -v "$BIN" >/dev/null 2>&1; then
              echo "ERROR: Missing executable: $BIN"
              exit 1
            fi

          done

          # Locate xfconfd through dpkg.
          XFCONFD_PATH=$(
            dpkg-query -L xfconf |
            grep -E '/xfconfd$' |
            head -n 1 || true
          )

          if [ -z "$XFCONFD_PATH" ] ||
             [ ! -x "$XFCONFD_PATH" ]; then
            echo "ERROR: xfconfd not found."
            dpkg-query -L xfconf || true
            exit 1
          fi

          echo "xfconfd: $XFCONFD_PATH"

          # Create RDP user.
          if id "$USERNAME" >/dev/null 2>&1; then
            sudo userdel -r "$USERNAME" || true
          fi

          sudo useradd -m -s /bin/bash "$USERNAME"

          printf '%s:%s\n' "$USERNAME" "$PASSWORD" |
            sudo chpasswd

          sudo usermod -aG sudo "$USERNAME"

          printf '%s ALL=(ALL) NOPASSWD:ALL\n' "$USERNAME" |
            sudo tee "/etc/sudoers.d/90-$USERNAME" >/dev/null

          sudo chmod 0440 "/etc/sudoers.d/90-$USERNAME"

          sudo visudo -cf "/etc/sudoers.d/90-$USERNAME"

          echo "RDP user created."

      # ============================================================
      # 3. PREPARE CLEAN USER ENVIRONMENT
      # ============================================================

      - name: Prepare XFCE user environment
        shell: bash
        env:
          OPENCODE_BASIC_USER: ${{ secrets.OPENCODE_BASIC_USER }}

        run: |
          set -Eeuo pipefail

          USERNAME="$OPENCODE_BASIC_USER"
          USER_HOME="/home/$USERNAME"

          UID_RDP=$(id -u "$USERNAME")
          GID_RDP=$(id -g "$USERNAME")

          echo "Preparing isolated user environment..."

          # --------------------------------------------------------
          # Create all required directories.
          # --------------------------------------------------------

          sudo install -d \
            -o "$UID_RDP" \
            -g "$GID_RDP" \
            -m 0755 \
            "$USER_HOME/.config" \
            "$USER_HOME/.cache" \
            "$USER_HOME/.local" \
            "$USER_HOME/.local/share" \
            "$USER_HOME/.local/state"

          sudo install -d \
            -o "$UID_RDP" \
            -g "$GID_RDP" \
            -m 0700 \
            "/run/user/$UID_RDP"

          # Verify runtime directory ownership.
          RUNTIME_OWNER=$(stat -c '%u' "/run/user/$UID_RDP")
          RUNTIME_MODE=$(stat -c '%a' "/run/user/$UID_RDP")

          if [ "$RUNTIME_OWNER" != "$UID_RDP" ] ||
             [ "$RUNTIME_MODE" != "700" ]; then

            echo "ERROR: Invalid XDG_RUNTIME_DIR."
            exit 1
          fi

          # --------------------------------------------------------
          # Remove inherited/broken session state.
          # --------------------------------------------------------

          sudo rm -rf \
            "$USER_HOME/.cache/sessions" \
            "$USER_HOME/.config/xfce4"

          sudo mkdir -p \
            "$USER_HOME/.config" \
            "$USER_HOME/.cache" \
            "$USER_HOME/.local/share"

          sudo chown -R "$USERNAME:$USERNAME" "$USER_HOME"

          # --------------------------------------------------------
          # Configure XFCE startup.
          # --------------------------------------------------------

          sudo tee "$USER_HOME/.xsession" >/dev/null <<'EOF'
          #!/bin/sh

          unset SESSION_MANAGER
          unset DBUS_SESSION_BUS_ADDRESS
          unset DBUS_STARTER_ADDRESS
          unset DBUS_STARTER_BUS_TYPE
          unset WAYLAND_DISPLAY

          export XDG_CONFIG_DIRS="/etc/xdg:/etc"
          export XDG_CONFIG_HOME="$HOME/.config"
          export XDG_CACHE_HOME="$HOME/.cache"
          export XDG_DATA_HOME="$HOME/.local/share"
          export XDG_STATE_HOME="$HOME/.local/state"

          export XDG_RUNTIME_DIR="/run/user/$(id -u)"

          export XDG_SESSION_TYPE="x11"
          export XDG_CURRENT_DESKTOP="XFCE"
          export XDG_SESSION_DESKTOP="xfce"
          export DESKTOP_SESSION="xfce"

          export GDK_BACKEND="x11"

          exec dbus-run-session -- startxfce4
          EOF

          sudo chmod 755 "$USER_HOME/.xsession"

          sudo chown "$USERNAME:$USERNAME" \
            "$USER_HOME/.xsession"

          # --------------------------------------------------------
          # Verify configuration directories.
          # --------------------------------------------------------

          test -d /etc/xdg
          test -d /etc/xdg/xfce4

          test -w "$USER_HOME/.config"
          test -w "$USER_HOME/.cache"
          test -w "$USER_HOME/.local/share"

          echo "User environment prepared."
          echo "UID: $UID_RDP"
          echo "GID: $GID_RDP"
          echo "Runtime: /run/user/$UID_RDP"

      # ============================================================
      # 4. VERIFY XFCE CONFIGURATION
      # ============================================================

      - name: Verify XFCE configuration files
        shell: bash

        run: |
          set -Eeuo pipefail

          XML="/etc/xdg/xfce4/xfconf/xfce-perchannel-xml/xfce4-session.xml"

          if [ ! -s "$XML" ]; then

            echo "XFCE session XML missing."
            echo "Reinstalling xfce4-session..."

            sudo apt-get install -y --reinstall xfce4-session

          fi

          if [ ! -s "$XML" ]; then
            echo "ERROR: XFCE session XML unavailable."
            exit 1
          fi

          python3 - "$XML" <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          path = sys.argv[1]

          try:
              root = ET.parse(path).getroot()
          except Exception as exc:
              sys.exit(f"Invalid XML: {exc}")

          if root.tag != "channel":
              sys.exit("Invalid XFCE channel.")

          if root.get("name") != "xfce4-session":
              sys.exit("Wrong XFCE channel.")

          def prop(parent, name):
              if parent is None:
                  return None

              for p in parent.findall("property"):
                  if p.get("name") == name:
                      return p

              return None

          general = prop(root, "general")
          failsafe = prop(general, "FailsafeSessionName")

          if failsafe is None:
              sys.exit("FailsafeSessionName is missing.")

          name = failsafe.get("value")

          if not name:
              sys.exit("FailsafeSessionName is empty.")

          sessions = prop(root, "sessions")
          session = prop(sessions, name)

          if session is None:
              sys.exit("Failsafe session definition missing.")

          flag = prop(session, "IsFailsafe")

          if flag is None or flag.get("value") != "true":
              sys.exit("Failsafe flag is invalid.")

          count = prop(session, "Count")

          if count is None:
              sys.exit("Failsafe Count missing.")

          try:
              number = int(count.get("value", "0"))
          except ValueError:
              sys.exit("Invalid Failsafe Count.")

          if not 1 <= number <= 100:
              sys.exit("Invalid Failsafe application count.")

          for i in range(number):
              command = prop(session, f"Client{i}_Command")

              if command is None:
                  sys.exit(f"Client{i}_Command missing.")

              if not command.findall("value"):
                  sys.exit(f"Client{i}_Command has no values.")

          print("XFCE system configuration verified.")
          print("Failsafe session:", name)
          print("Applications:", number)
          PY

      # ============================================================
      # 5. VERIFY D-BUS AND XFCONF
      # ============================================================

      - name: Verify D-Bus and XFConf
        shell: bash
        env:
          OPENCODE_BASIC_USER: ${{ secrets.OPENCODE_BASIC_USER }}

        run: |
          set -Eeuo pipefail

          USERNAME="$OPENCODE_BASIC_USER"
          USER_HOME="/home/$USERNAME"

          UID_RDP=$(id -u "$USERNAME")
          GID_RDP=$(id -g "$USERNAME")

          RUNTIME="/run/user/$UID_RDP"

          # Ensure runtime directory is correct.
          sudo install -d \
            -o "$UID_RDP" \
            -g "$GID_RDP" \
            -m 0700 \
            "$RUNTIME"

          # Explicitly prepare every XDG directory.
          sudo install -d \
            -o "$UID_RDP" \
            -g "$GID_RDP" \
            -m 0755 \
            "$USER_HOME/.config" \
            "$USER_HOME/.cache" \
            "$USER_HOME/.local/share" \
            "$USER_HOME/.local/state"

          echo "Starting isolated XFCE D-Bus test..."

          # IMPORTANT:
          # env -i removes the runner's inherited variables.
          # HOME, XDG_CONFIG_HOME and XDG_RUNTIME_DIR
          # are explicitly defined for the RDP user.

          sudo -u "$USERNAME" \
            env -i \
              HOME="$USER_HOME" \
              USER="$USERNAME" \
              LOGNAME="$USERNAME" \
              SHELL="/bin/bash" \
              PATH="/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin" \
              XDG_CONFIG_DIRS="/etc/xdg:/etc" \
              XDG_CONFIG_HOME="$USER_HOME/.config" \
              XDG_CACHE_HOME="$USER_HOME/.cache" \
              XDG_DATA_HOME="$USER_HOME/.local/share" \
              XDG_STATE_HOME="$USER_HOME/.local/state" \
              XDG_RUNTIME_DIR="$RUNTIME" \
              XDG_SESSION_TYPE="x11" \
              XDG_CURRENT_DESKTOP="XFCE" \
              dbus-run-session -- bash -Eeuo pipefail <<'BASH'

          echo "Checking environment..."

          test "$HOME" = "$(getent passwd "$USER" | cut -d: -f6)"

          test "$XDG_CONFIG_HOME" = "$HOME/.config"

          test "$XDG_CONFIG_DIRS" = "/etc/xdg:/etc"

          test -d "$XDG_RUNTIME_DIR"

          test "$(stat -c '%u' "$XDG_RUNTIME_DIR")" = "$(id -u)"

          test "$(stat -c '%a' "$XDG_RUNTIME_DIR")" = "700"

          test -w "$XDG_CONFIG_HOME"
          test -w "$XDG_CACHE_HOME"
          test -w "$XDG_DATA_HOME"

          echo "HOME: $HOME"
          echo "XDG_CONFIG_HOME: $XDG_CONFIG_HOME"
          echo "XDG_CONFIG_DIRS: $XDG_CONFIG_DIRS"
          echo "XDG_RUNTIME_DIR: $XDG_RUNTIME_DIR"

          echo "D-Bus address:"
          test -n "$DBUS_SESSION_BUS_ADDRESS"
          echo "D-Bus session available."

          echo "Testing XFConf..."

          # Start xfconfd through D-Bus activation.
          NAME=$(
            xfconf-query \
              -c xfce4-session \
              -p /general/FailsafeSessionName
          )

          if [ "$NAME" != "Failsafe" ]; then
            echo "ERROR: Unexpected Failsafe name: $NAME"
            exit 1
          fi

          FLAG=$(
            xfconf-query \
              -c xfce4-session \
              -p "/sessions/$NAME/IsFailsafe"
          )

          if [[ "$FLAG" != "true" && "$FLAG" != "1" ]]; then
            echo "ERROR: Failsafe flag is invalid."
            exit 1
          fi

          COUNT=$(
            xfconf-query \
              -c xfce4-session \
              -p "/sessions/$NAME/Count"
          )

          if ! [[ "$COUNT" =~ ^[0-9]+$ ]] ||
             (( COUNT < 1 || COUNT > 100 )); then
            echo "ERROR: Invalid application count."
            exit 1
          fi

          echo "Failsafe name: $NAME"
          echo "Failsafe flag: $FLAG"
          echo "Application count: $COUNT"

          echo "XFConf backend successfully initialized."

          BASH

          echo "D-Bus and XFConf verification passed."

      # ============================================================
      # 6. CONFIGURE XRDP
      # ============================================================

      - name: Configure XRDP
        shell: bash

        run: |
          set -Eeuo pipefail

          echo "Configuring XRDP..."

          sudo adduser xrdp ssl-cert || true

          for FILE in \
            /etc/xrdp/xrdp.ini \
            /etc/xrdp/sesman.ini \
            /etc/xrdp/startwm.sh; do

            if [ ! -s "$FILE" ]; then
              echo "ERROR: Missing $FILE"
              exit 1
            fi

          done

          sudo systemctl enable xrdp
          sudo systemctl enable xrdp-sesman

          sudo systemctl restart xrdp-sesman
          sudo systemctl restart xrdp

          sleep 5

          for SERVICE in xrdp xrdp-sesman; do

            if ! sudo systemctl is-active --quiet "$SERVICE"; then

              echo "ERROR: $SERVICE failed."

              sudo journalctl \
                -u "$SERVICE" \
                -n 100 \
                --no-pager || true

              exit 1
            fi

          done

          if ! sudo ss -lnt | grep -q ':3389'; then
            echo "ERROR: Port 3389 is not listening."
            exit 1
          fi

          echo "XRDP successfully configured."

      # ============================================================
      # 7. INSTALL BORE
      # ============================================================

      - name: Install Bore
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

        run: |
          set -Eeuo pipefail

          API=$(
            curl -fsSL \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              https://api.github.com/repos/ekzhang/bore/releases/latest
          )

          TAG=$(python3 -c \
            "import json,sys;print(json.load(sys.stdin)['tag_name'])" \
            <<< "$API")

          ASSET_URL=$(python3 -c '
          import json
          import sys

          data = json.load(sys.stdin)

          for asset in data.get("assets", []):
              name = asset["name"]

              if "x86_64-unknown-linux" in name and name.endswith(".tar.gz"):
                  print(asset["browser_download_url"])
                  break
          ' <<< "$API")

          if [ -z "$ASSET_URL" ]; then
            echo "ERROR: No compatible Bore release found."
            exit 1
          fi

          echo "Installing Bore $TAG"

          rm -f bore bore.tar.gz

          curl -fL "$ASSET_URL" -o bore.tar.gz

          tar -xzf bore.tar.gz

          if [ ! -f ./bore ]; then

            FOUND=$(
              find . -maxdepth 3 \
                -type f -name bore |
              head -n 1 || true
            )

            if [ -z "$FOUND" ]; then
              echo "ERROR: Bore executable missing."
              exit 1
            fi

            cp "$FOUND" ./bore
          fi

          chmod +x ./bore

          ./bore --version

          echo "Bore installed."

      # ============================================================
      # 8. START BORE
      # ============================================================

      - name: Start Bore tunnel
        shell: bash

        run: |
          set -Eeuo pipefail

          rm -f connection.txt bore.pid bore_out.log

          echo "Starting Bore tunnel..."

          env -u RUNNER_TRACKING_ID \
            nohup ./bore local 3389 \
              --to bore.pub \
              > bore_out.log 2>&1 \
              </dev/null &

          BORE_PID=$!

          echo "$BORE_PID" > bore.pid

          READY=0

          for i in $(seq 1 60); do

            if ! kill -0 "$BORE_PID" 2>/dev/null; then
              echo "ERROR: Bore exited."
              cat bore_out.log || true
              exit 1
            fi

            CLEAN=$(sed -r \
              's/\x1b\[[0-9;]*m//g' \
              bore_out.log || true)

            PORT=$(
              echo "$CLEAN" |
              sed -nE \
                's/.*listening at bore\.pub:([0-9]+).*/\1/p' |
              tail -n 1
            )

            if [[ "$PORT" =~ ^[0-9]+$ ]] &&
               (( PORT >= 1 && PORT <= 65535 )); then

              printf 'host=bore.pub\nport=%s\n' \
                "$PORT" > connection.txt

              READY=1
              break
            fi

            sleep 1

          done

          if [ "$READY" -ne 1 ]; then
            echo "ERROR: Bore startup timed out."
            cat bore_out.log || true
            exit 1
          fi

          echo "Bore tunnel ready."
          cat connection.txt

      # ============================================================
      # 9. FINAL XFCE VERIFICATION
      # ============================================================

      - name: Final XFCE verification
        shell: bash
        env:
          OPENCODE_BASIC_USER: ${{ secrets.OPENCODE_BASIC_USER }}

        run: |
          set -Eeuo pipefail

          USERNAME="$OPENCODE_BASIC_USER"
          USER_HOME="/home/$USERNAME"

          UID_RDP=$(id -u "$USERNAME")
          GID_RDP=$(id -g "$USERNAME")

          RUNTIME="/run/user/$UID_RDP"

          echo "Final verification..."

          # Session script.
          test -x "$USER_HOME/.xsession"

          grep -q 'XDG_CONFIG_DIRS="/etc/xdg:/etc"' \
            "$USER_HOME/.xsession"

          grep -q 'dbus-run-session -- startxfce4' \
            "$USER_HOME/.xsession"

          # Configuration.
          test -s \
            /etc/xdg/xfce4/xfconf/xfce-perchannel-xml/xfce4-session.xml

          # Runtime directory.
          test "$(stat -c '%u' "$RUNTIME")" = "$UID_RDP"
          test "$(stat -c '%a' "$RUNTIME")" = "700"

          # Test XFConf using a completely clean environment.
          sudo -u "$USERNAME" \
            env -i \
              HOME="$USER_HOME" \
              USER="$USERNAME" \
              LOGNAME="$USERNAME" \
              SHELL="/bin/bash" \
              PATH="/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin" \
              XDG_CONFIG_DIRS="/etc/xdg:/etc" \
              XDG_CONFIG_HOME="$USER_HOME/.config" \
              XDG_CACHE_HOME="$USER_HOME/.cache" \
              XDG_DATA_HOME="$USER_HOME/.local/share" \
              XDG_STATE_HOME="$USER_HOME/.local/state" \
              XDG_RUNTIME_DIR="$RUNTIME" \
            dbus-run-session -- bash -Eeuo pipefail <<'BASH'

          NAME=$(xfconf-query \
            -c xfce4-session \
            -p /general/FailsafeSessionName)

          test "$NAME" = "Failsafe"

          FLAG=$(xfconf-query \
            -c xfce4-session \
            -p "/sessions/$NAME/IsFailsafe")

          [[ "$FLAG" == "true" || "$FLAG" == "1" ]]

          COUNT=$(xfconf-query \
            -c xfce4-session \
            -p "/sessions/$NAME/Count")

          [[ "$COUNT" =~ ^[0-9]+$ ]]
          (( COUNT >= 1 && COUNT <= 100 ))

          echo "XFConf: OK"
          echo "Failsafe: OK"

          BASH

          # XRDP.
          sudo systemctl is-active --quiet xrdp
          sudo systemctl is-active --quiet xrdp-sesman

          sudo ss -lnt | grep -q ':3389'

          # Bore.
          test -s connection.txt
          test -s bore.pid

          BORE_PID=$(cat bore.pid)

          kill -0 "$BORE_PID"

          echo "=========================================="
          echo "ALL CHECKS PASSED"
          echo "=========================================="

      # ============================================================
      # 10. UPDATE README
      # ============================================================

      - name: Update README
        shell: bash
        env:
          OPENCODE_BASIC_USER: ${{ secrets.OPENCODE_BASIC_USER }}
          SESSION_MINUTES: ${{ github.event.inputs.session_minutes }}

        run: |
          set -Eeuo pipefail

          test -s connection.txt

          HOST=$(grep '^host=' connection.txt | cut -d= -f2)
          PORT=$(grep '^port=' connection.txt | cut -d= -f2)

          EXPIRY=$(date -u \
            -d "+${SESSION_MINUTES} minutes" \
            '+%Y-%m-%d %H:%M:%S UTC')

          export HOST PORT EXPIRY

          python3 <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path("README.md")

          host = os.environ["HOST"]
          port = os.environ["PORT"]
          expiry = os.environ["EXPIRY"]
          username = os.environ["OPENCODE_BASIC_USER"]

          section = f"""## Ubuntu RDP Access

          **Connection Address:** `{host}:{port}`

          **Username:** `{username}`

          **Password:** (stored in GitHub Secrets: `OPENCODE_BASIC_PASS`)

          **Expires:** {expiry}
          """

          section = "\n".join(
              line.lstrip() for line in section.splitlines()
          ).strip()

          original = path.read_text() if path.exists() else ""

          match = re.search(
              r"(?m)^## Ubuntu RDP Access[ \t]*\n",
              original
          )

          if match:
              next_heading = re.search(
                  r"(?m)^## (?!Ubuntu RDP Access)[^\n]*",
                  original[match.end():]
              )

              end = (
                  match.end() + next_heading.start()
                  if next_heading else len(original)
              )

              result = (
                  original[:match.start()]
                  + section + "\n\n"
                  + original[end:].lstrip("\n")
              )
          else:
              result = original.rstrip()

              if result:
                  result += "\n\n"

              result += section + "\n"

          path.write_text(result)

          print("README updated.")

          PY

      # ============================================================
      # 11. COMMIT README
      # ============================================================

      - name: Commit and push README
        shell: bash

        run: |
          set -Eeuo pipefail

          git config user.name "github-actions[bot]"

          git config user.email \
            "github-actions[bot]@users.noreply.github.com"

          git add README.md

          if git diff --cached --quiet; then
            echo "No README changes."
          else
            git commit -m "Update RDP access info [skip ci]"
            git push
          fi

      # ============================================================
      # 12. DISPLAY CONNECTION
      # ============================================================

      - name: Display connection information
        shell: bash
        env:
          OPENCODE_BASIC_USER: ${{ secrets.OPENCODE_BASIC_USER }}

        run: |
          set -Eeuo pipefail

          HOST=$(grep '^host=' connection.txt | cut -d= -f2)
          PORT=$(grep '^port=' connection.txt | cut -d= -f2)

          echo ""
          echo "=========================================="
          echo "          UBUNTU RDP READY"
          echo "=========================================="
          echo ""
          echo "Host: $HOST"
          echo "Port: $PORT"
          echo "Username: $OPENCODE_BASIC_USER"
          echo "Password: GitHub Secret OPENCODE_BASIC_PASS"
          echo ""
          echo "Android Microsoft Remote Desktop:"
          echo "PC Name: $HOST:$PORT"
          echo "Username: $OPENCODE_BASIC_USER"
          echo ""
          echo "=========================================="

      # ============================================================
      # 13. KEEP SESSION ALIVE
      # ============================================================

      - name: Keep session alive
        shell: bash
        env:
          SESSION_MINUTES: ${{ github.event.inputs.session_minutes }}

        run: |
          set -Eeuo pipefail

          DURATION="$SESSION_MINUTES"

          END_TIME=$(( $(date +%s) + DURATION * 60 ))

          BORE_PID=$(cat bore.pid)

          echo "Session duration: $DURATION minutes."

          while [ "$(date +%s)" -lt "$END_TIME" ]; do

            NOW=$(date +%s)
            REMAIN=$(( END_TIME - NOW ))

            printf 'Remaining %02d:%02d:%02d | %s\n' \
              "$((REMAIN / 3600))" \
              "$(((REMAIN % 3600) / 60))" \
              "$((REMAIN % 60))" \
              "$(date -u +%H:%M:%S)"

            if ! kill -0 "$BORE_PID" 2>/dev/null; then
              echo "ERROR: Bore stopped."
              cat bore_out.log || true
              exit 1
            fi

            if ! sudo systemctl is-active --quiet xrdp; then
              echo "Restarting XRDP..."
              sudo systemctl restart xrdp
            fi

            if ! sudo systemctl is-active --quiet xrdp-sesman; then
              echo "Restarting XRDP sesman..."
              sudo systemctl restart xrdp-sesman
            fi

            sleep 30

          done

          echo "Session completed."

      # ============================================================
      # 14. CLEANUP
      # ============================================================

      - name: Cleanup
        if: always()
        shell: bash

        run: |
          echo "Cleaning up..."

          if [ -f bore.pid ]; then

            BORE_PID=$(cat bore.pid)

            if [[ "$BORE_PID" =~ ^[0-9]+$ ]]; then
              kill "$BORE_PID" 2>/dev/null || true
            fi

          fi

          sudo systemctl stop xrdp 2>/dev/null || true
          sudo systemctl stop xrdp-sesman 2>/dev/null || true

          echo "Cleanup completed."
