name: Web RDP on Ubuntu (Guacamole + Cloudflare Tunnel)

on:
  workflow_dispatch:

jobs:
  rdp-web:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ------------------------------------------------------------------
      # 1) XFCE + xrdp
      # ------------------------------------------------------------------
      - name: Install XFCE + xrdp
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            xfce4 xfce4-goodies xrdp dbus-x11 xterm \
            curl wget unzip ca-certificates gnupg lsb-release

          echo "xfce4-session" > /home/runner/.xsession
          chown runner:runner /home/runner/.xsession

          echo "runner:Passw0rd!123" | sudo chpasswd
          sudo adduser xrdp ssl-cert || true
          echo "allowed_users=anybody" | sudo tee -a /etc/xrdp/sesman.ini

          sudo systemctl enable xrdp
          sudo systemctl restart xrdp
          sleep 3
          sudo systemctl status xrdp --no-pager || true
          sudo ss -tlnp | grep 3389 || true

      # ------------------------------------------------------------------
      # 2) Docker
      # ------------------------------------------------------------------
      - name: Install Docker
        run: |
          sudo apt-get install -y -qq docker.io docker-compose-v2
          sudo systemctl start docker
          sudo usermod -aG docker $USER
          sudo docker version

      # ------------------------------------------------------------------
      # 3) Guacamole stack  ← اینجا اصلاح اصلی است
      # ------------------------------------------------------------------
      - name: Setup Guacamole stack
        run: |
          mkdir -p ~/guac/initdb
          cd ~/guac

          # پاکسازی احتمالی volume های قدیمی
          sudo docker compose down -v 2>/dev/null || true

          echo "Generating init.sql..."
          sudo docker run --rm guacamole/guacamole:latest \
            /opt/guacamole/bin/initdb.sh --postgresql > initdb/init.sql
          echo "init.sql size: $(wc -c < initdb/init.sql) bytes"
          if [ ! -s initdb/init.sql ]; then
            echo "::error::init.sql is empty"
            exit 1
          fi

          cat > docker-compose.yml <<'EOF'
          services:
            guacd:
              image: guacamole/guacd:latest
              restart: always
              ports:
                - "4822:4822"
              extra_hosts:
                - "host.docker.internal:host-gateway"

            postgres:
              image: postgres:16-alpine
              restart: always
              environment:
                POSTGRES_DB: guacamole_db
                POSTGRES_USER: guacamole_user
                POSTGRES_PASSWORD: guacamole_pass
              volumes:
                - ./initdb:/docker-entrypoint-initdb.d:ro

            guacamole:
              image: guacamole/guacamole:latest
              restart: always
              ports:
                - "8080:8080"
              environment:
                GUACD_HOSTNAME: guacd
                POSTGRESQL_HOSTNAME: postgres
                POSTGRESQL_DATABASE: guacamole_db
                POSTGRESQL_USER: guacamole_user
                POSTGRESQL_PASSWORD: guacamole_pass
              depends_on:
                - guacd
                - postgres
          EOF

          sudo docker compose up -d
          sudo docker ps -a

      # ------------------------------------------------------------------
      # 4) انتظار readiness
      # ------------------------------------------------------------------
      - name: Wait for Guacamole readiness
        run: |
          echo "Waiting for Guacamole..."
          ok=0
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/guacamole/ || echo "000")
            echo "[$i] HTTP $code"
            if [ "$code" = "200" ] || [ "$code" = "302" ] || [ "$code" = "403" ]; then
              ok=1
              break
            fi
            sleep 3
          done

          if [ "$ok" != "1" ]; then
            echo "::error::Guacamole did not become ready"
            sudo docker ps -a
            sudo docker logs $(sudo docker ps -aqf "name=guacamole") 2>&1 | tail -80 || true
            sudo docker logs $(sudo docker ps -aqf "name=postgres") 2>&1 | tail -80 || true
            exit 1
          fi

      # ------------------------------------------------------------------
      # 5) گرفتن توکن + ساخت connection
      # ------------------------------------------------------------------
      - name: Configure RDP connection in Guacamole
        run: |
          BASE="http://localhost:8080/guacamole"
          TOKEN=""

          # ۵ بار با فاصله ۱۵ ثانیه (rate-limit = 5 در ۵ دقیقه → بعد از ۵ بار restart)
          for attempt in $(seq 1 5); do
            RESP=$(curl -s -X POST "$BASE/api/tokens" \
              --data-urlencode "username=guacadmin" \
              --data-urlencode "password=guacadmin" || true)
            echo "attempt $attempt: $RESP" | head -c 300; echo

            TOKEN=$(echo "$RESP" | python3 -c "
          import sys, json
          try:
              print(json.load(sys.stdin).get('authToken',''))
          except Exception:
              print('')
          " 2>/dev/null)

            [ -n "$TOKEN" ] && break

            # اگر بلاک شدیم، کانتینر را ریستارت کن تا tracker پاک شود
            if echo "$RESP" | grep -q "Too many failed"; then
              echo "Rate limited; restarting guacamole container..."
              sudo docker restart $(sudo docker ps -aqf "name=guacamole") || true
              sleep 10
            else
              sleep 15
            fi
          done

          if [ -z "$TOKEN" ]; then
            echo "::error::Could not obtain Guacamole authToken"
            sudo docker logs $(sudo docker ps -aqf "name=guacamole") 2>&1 | tail -60 || true
            sudo docker logs $(sudo docker ps -aqf "name=postgres") 2>&1 | tail -60 || true
            exit 1
          fi

          echo "Token acquired: ${TOKEN:0:12}..."

          echo "Creating RDP connection..."
          curl -s -X POST "$BASE/api/session/data/postgresql/connections?token=$TOKEN" \
            -H "Content-Type: application/json" \
            -d '{
              "parentIdentifier": "ROOT",
              "name": "Ubuntu RDP",
              "protocol": "rdp",
              "parameters": {
                "hostname": "host.docker.internal",
                "port": "3389",
                "username": "runner",
                "password": "Passw0rd!123",
                "security": "any",
                "ignore-cert": "true",
                "resize-method": "display-update",
                "color-depth": "24",
                "enable-drive": "false"
              },
              "attributes": {
                "max-connections": "",
                "max-connections-per-user": "",
                "weight": "",
                "failover-only": "",
                "guacd-port": "",
                "guacd-encryption": ""
              }
            }' | head -c 800
          echo
          echo "Listing connections:"
          curl -s "$BASE/api/session/data/postgresql/connections?token=$TOKEN" | head -c 800
          echo

      # ------------------------------------------------------------------
      # 6) Cloudflare Tunnel
      # ------------------------------------------------------------------
      - name: Install & start cloudflared
        run: |
          wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared-linux-amd64.deb

          nohup cloudflared tunnel --url http://localhost:8080 --no-autoupdate > ~/tunnel.log 2>&1 &
          echo $! > ~/tunnel.pid

          for i in $(seq 1 30); do
            if grep -q "trycloudflare.com" ~/tunnel.log; then break; fi
            sleep 2
          done

          URL=$(grep -oE 'https://[a-z0-9-]+\.trycloudflare\.com' ~/tunnel.log | head -1)
          if [ -z "$URL" ]; then
            echo "::error::Could not extract tunnel URL"
            cat ~/tunnel.log
            exit 1
          fi

          echo "TUNNEL_URL=$URL" >> $GITHUB_ENV
          echo "::notice title=Guacamole URL::$URL/guacamole"
          cat ~/tunnel.log

      # ------------------------------------------------------------------
      # 7) نمایش اطلاعات + keep-alive
      # ------------------------------------------------------------------
      - name: Show credentials & keep alive
        run: |
          echo "==================================================="
          echo "  Web RDP (Guacamole) via Cloudflare Tunnel"
          echo "  URL:  $TUNNEL_URL/guacamole"
          echo ""
          echo "  Login Guacamole:"
          echo "    user: guacadmin"
          echo "    pass: guacadmin"
          echo ""
          echo "  RDP connection (از قبل ساخته شده):"
          echo "    name: Ubuntu RDP"
          echo "    user: runner"
          echo "    pass: Passw0rd!123"
          echo "==================================================="

          while true; do
            sleep 300
            echo "[$(date)] tunnel: $TUNNEL_URL"
            echo -n "xrdp: "; sudo systemctl is-active xrdp || true
            echo -n "guac http: "; curl -s -o /dev/null -w "%{http_code}\n" http://localhost:8080/guacamole/ || true
            if ! kill -0 $(cat ~/tunnel.pid) 2>/dev/null; then
              echo "tunnel died, restarting..."
              nohup cloudflared tunnel --url http://localhost:8080 --no-autoupdate > ~/tunnel.log 2>&1 &
              echo $! > ~/tunnel.pid
              sleep 10
              NEW=$(grep -oE 'https://[a-z0-9-]+\.trycloudflare\.com' ~/tunnel.log | head -1)
              [ -n "$NEW" ] && echo "new URL: $NEW"
            fi
          done