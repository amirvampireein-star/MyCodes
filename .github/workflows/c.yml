name: Ubuntu RDP with bore (Auto-Update README)

on:
  workflow_dispatch:
    inputs:
      session_minutes:
        description: 'Duration in minutes'
        required: true
        default: '120'

permissions:
  contents: write

jobs:
  rdp-tunnel:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # ------------------------------------------------------------------
      # 1) نصب xrdp + XFCE و ساخت کاربر از OPENCODE_BASIC_USER/PASS
      # ------------------------------------------------------------------
      - name: Install xrdp + XFCE and create user
        shell: bash
        env:
          OPENCODE_BASIC_USER: ${{ secrets.OPENCODE_BASIC_USER }}
          OPENCODE_BASIC_PASS: ${{ secrets.OPENCODE_BASIC_PASS }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            xfce4 xfce4-goodies xrdp dbus-x11 xterm curl wget

          USERNAME="$OPENCODE_BASIC_USER"
          PASSWORD="$OPENCODE_BASIC_PASS"

          if [ -z "$USERNAME" ] || [ -z "$PASSWORD" ]; then
            echo "ERROR: OPENCODE_BASIC_USER or OPENCODE_BASIC_PASS is empty"
            exit 1
          fi

          if id "$USERNAME" >/dev/null 2>&1; then
            sudo userdel -r "$USERNAME" || true
          fi

          sudo useradd -m -s /bin/bash "$USERNAME"
          echo "$USERNAME:$PASSWORD" | sudo chpasswd
          sudo usermod -aG sudo "$USERNAME"
          echo "$USERNAME ALL=(ALL) NOPASSWD:ALL" | sudo tee /etc/sudoers.d/90-$USERNAME >/dev/null

          echo "xfce4-session" | sudo tee /home/$USERNAME/.xsession >/dev/null
          sudo chown $USERNAME:$USERNAME /home/$USERNAME/.xsession

          echo "allowed_users=anybody" | sudo tee -a /etc/xrdp/sesman.ini
          sudo adduser xrdp ssl-cert || true

          sudo systemctl enable xrdp
          sudo systemctl restart xrdp
          sleep 3

          if ! systemctl is-active --quiet xrdp; then
            echo "ERROR: xrdp failed to start"
            sudo journalctl -u xrdp -n 50 --no-pager
            exit 1
          fi
          echo "User $USERNAME created and RDP enabled."
          sudo ss -tlnp | grep 3389 || true

      # ------------------------------------------------------------------
      # 2) دانلود bore + ساخت اسکریپت رانر
      # ------------------------------------------------------------------
      - name: Install bore and create runner script
        shell: bash
        run: |
          set -euo pipefail

          BORE_URL="https://github.com/ekzhang/bore/releases/latest/download/bore-v0.5.3-x86_64-unknown-linux-musl.tar.gz"
          if ! curl -fsSL "$BORE_URL" -o bore.tar.gz; then
            echo "Direct download failed, using install script"
            curl -fsSL https://raw.githubusercontent.com/ekzhang/bore/main/install.sh | bash -s -- --to /usr/local/bin
            BORE_BIN="/usr/local/bin/bore"
          else
            tar -xzf bore.tar.gz
            chmod +x bore
            BORE_BIN="./bore"
          fi
          echo "Bore binary: $BORE_BIN"
          $BORE_BIN --version || true

          cat > bore_runner.sh <<'EOF'
          #!/usr/bin/env bash
          OUT_LOG="bore_out.log"
          ERR_LOG="bore_err.log"
          TUNNEL_HOST="bore.pub"
          BORE_BIN="${BORE_BIN:-./bore}"

          start_bore() {
            pkill -f "$BORE_BIN local 3389" 2>/dev/null || true
            : > "$OUT_LOG"; : > "$ERR_LOG"
            nohup "$BORE_BIN" local 3389 --to "$TUNNEL_HOST" > "$OUT_LOG" 2> "$ERR_LOG" &
            echo $! > bore.pid
            sleep 8
            CLEAN=$(sed -r 's/\x1b\[[0-9;]*m//g' "$OUT_LOG" || true)
            PORT=$(echo "$CLEAN" | grep -oP 'listening at [\w\.]+:\K\d+' | head -n1 || true)
            if [ -n "$PORT" ]; then
              printf 'host=%s\nport=%s\n' "$TUNNEL_HOST" "$PORT" > connection.txt
              echo "Tunnel established on port $PORT"
              return 0
            fi
            return 1
          }

          (
            while true; do
              (exec 3<>/dev/tcp/127.0.0.1/3389) 2>/dev/null || true
              exec 3>&- 2>/dev/null || true
              sleep 30
            done
          ) &

          if ! start_bore; then
            echo "ERROR: Could not start bore."
            cat "$OUT_LOG" "$ERR_LOG" || true
            exit 1
          fi

          while true; do
            sleep 30
            if ! kill -0 "$(cat bore.pid 2>/dev/null)" 2>/dev/null; then
              echo "Bore stopped. Restarting..."
              start_bore || echo "restart failed"
            fi
          done
          EOF
          chmod +x bore_runner.sh
          echo "bore_runner.sh created."

      # ------------------------------------------------------------------
      # 3) اجرای detached bore runner
      # ------------------------------------------------------------------
      - name: Start bore tunnel (detached)
        shell: bash
        run: |
          set -euo pipefail
          rm -f connection.txt bore_out.log bore_err.log bore.pid

          nohup env BORE_BIN="${BORE_BIN:-./bore}" ./bore_runner.sh > bore_runner.log 2>&1 &
          echo $! > bore_runner.pid
          echo "Bore runner started in background (pid $(cat bore_runner.pid))."

          echo "Waiting for tunnel to be ready..."
          for i in $(seq 1 30); do
            if [ -f connection.txt ]; then break; fi
            sleep 1
          done
          if [ -f connection.txt ]; then
            echo "Tunnel is ready:"; cat connection.txt
          else
            echo "WARNING: Tunnel may not have started. Will try to continue."
            echo "--- bore_runner.log ---"; cat bore_runner.log || true
            echo "--- bore_out.log ---";    cat bore_out.log || true
            echo "--- bore_err.log ---";    cat bore_err.log || true
          fi

      # ------------------------------------------------------------------
      # 4) به‌روزرسانی README
      # ------------------------------------------------------------------
      - name: Update README.md
        shell: bash
        env:
          OPENCODE_BASIC_USER: ${{ secrets.OPENCODE_BASIC_USER }}
        run: |
          set -euo pipefail
          if [ ! -f connection.txt ]; then
            echo "ERROR: connection.txt not found."
            exit 1
          fi

          HOST=$(grep '^host=' connection.txt | cut -d= -f2)
          PORT=$(grep '^port=' connection.txt | cut -d= -f2)
          CONNECTION_STRING="${HOST}:${PORT}"

          USERNAME="$OPENCODE_BASIC_USER"
          EXPIRY=$(date -u -d "+${{ github.event.inputs.session_minutes }} minutes" '+%Y-%m-%d %H:%M:%S UTC')

          NEW_SECTION="## Ubuntu RDP Access
          **Connection Address:** \`$CONNECTION_STRING\`
          **Username:** \`$USERNAME\`
          **Password:** (stored in GitHub Secrets: \`OPENCODE_BASIC_PASS\`)
          **Expires:** $EXPIRY
          "

          if [ ! -f README.md ]; then
            printf '%s\n' "$NEW_SECTION" > README.md
          else
            if grep -q '## Ubuntu RDP Access' README.md; then
              awk '/^## Ubuntu RDP Access/ {exit} {print}' README.md > README.tmp
              printf '%s\n' "$NEW_SECTION" >> README.tmp
              mv README.tmp README.md
            else
              printf '\n%s\n' "$NEW_SECTION" >> README.md
            fi
          fi
          echo "README.md updated."

      # ------------------------------------------------------------------
      # 5) commit + push
      # ------------------------------------------------------------------
      - name: Commit and push README.md
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Update RDP access info [skip ci]" --allow-empty
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ------------------------------------------------------------------
      # 6) نمایش اطلاعات
      # ------------------------------------------------------------------
      - name: Display connection info
        shell: bash
        env:
          OPENCODE_BASIC_USER: ${{ secrets.OPENCODE_BASIC_USER }}
        run: |
          set -euo pipefail
          HOST=$(grep '^host=' connection.txt | cut -d= -f2)
          PORT=$(grep '^port=' connection.txt | cut -d= -f2)
          echo ""
          echo "======================================================"
          echo "  UBUNTU RDP READY FOR ANDROID"
          echo "======================================================"
          echo "  Host: $HOST"
          echo "  Port: $PORT"
          echo "  Username: $OPENCODE_BASIC_USER"
          echo "  Password: (your secret OPENCODE_BASIC_PASS)"
          echo "======================================================"
          echo ""
          echo "In Microsoft Remote Desktop on Android:"
          echo "  PC Name: $HOST:$PORT"
          echo "  User Name: $OPENCODE_BASIC_USER"

      # ------------------------------------------------------------------
      # 7) keep-alive
      # ------------------------------------------------------------------
      - name: Keep session alive
        shell: bash
        run: |
          set -euo pipefail
          DURATION=${{ github.event.inputs.session_minutes }}
          END_TIME=$(( $(date +%s) + DURATION*60 ))
          echo "Session will stay active for $DURATION minutes."
          while [ "$(date +%s)" -lt "$END_TIME" ]; do
            NOW=$(date +%s)
            REMAIN=$(( END_TIME - NOW ))
            printf 'Remaining %02d:%02d:%02d | %s\n' \
              $((REMAIN/3600)) $(((REMAIN%3600)/60)) $((REMAIN%60)) "$(date -u +%H:%M:%S)"
            sleep 60
          done
          echo "Time is up."