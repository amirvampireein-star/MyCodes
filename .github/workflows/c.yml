
name: Ubuntu RDP with bore (Auto-Update README)

on:
  workflow_dispatch:
    inputs:
      session_minutes:
        description: 'Duration in minutes'
        required: true
        default: '120'

permissions:
  contents: write

concurrency:
  group: ubuntu-rdp-session
  cancel-in-progress: true

jobs:
  rdp-tunnel:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      DEBIAN_FRONTEND: noninteractive

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # ============================================================
      # 2. INSTALL PACKAGES
      # ============================================================

      - name: Install XFCE XRDP and dependencies
        shell: bash
        env:
          OPENCODE_BASIC_USER: ${{ secrets.OPENCODE_BASIC_USER }}
          OPENCODE_BASIC_PASS: ${{ secrets.OPENCODE_BASIC_PASS }}
          SESSION_MINUTES: ${{ github.event.inputs.session_minutes }}

        run: |
          set -Eeuo pipefail

          echo "=========================================="
          echo "Installing Ubuntu RDP environment"
          echo "=========================================="

          if ! [[ "$SESSION_MINUTES" =~ ^[0-9]+$ ]] ||
             (( SESSION_MINUTES < 1 || SESSION_MINUTES > 330 )); then
            echo "ERROR: Invalid session duration."
            exit 1
          fi

          USERNAME="$OPENCODE_BASIC_USER"
          PASSWORD="$OPENCODE_BASIC_PASS"

          if [ -z "$USERNAME" ]; then
            echo "ERROR: Username secret is empty."
            exit 1
          fi

          if [ -z "$PASSWORD" ]; then
            echo "ERROR: Password secret is empty."
            exit 1
          fi

          sudo apt-get update -qq

          sudo apt-get install -y -qq \
            xfce4 \
            xfce4-goodies \
            xfce4-session \
            xfconf \
            xfce4-settings \
            xfce4-panel \
            xfdesktop4 \
            xfwm4 \
            thunar \
            xrdp \
            xorgxrdp \
            xserver-xorg-core \
            dbus \
            dbus-x11 \
            dbus-user-session \
            dbus-daemon \
            xauth \
            x11-xserver-utils \
            xterm \
            curl \
            wget \
            ca-certificates \
            python3 \
            tar \
            gzip

          echo "Package installation completed."

          # --------------------------------------------------------
          # Verify essential binaries
          # --------------------------------------------------------

          for BIN in \
            startxfce4 \
            xfce4-session \
            xfconfd \
            xfconf-query \
            dbus-run-session \
            Xorg \
            xfwm4 \
            xfce4-panel \
            xfdesktop \
            Thunar; do

            if ! command -v "$BIN" >/dev/null 2>&1; then
              echo "ERROR: Missing executable: $BIN"
              exit 1
            fi

          done

          # --------------------------------------------------------
          # Verify system configuration directory
          # --------------------------------------------------------

          if [ ! -d /etc/xdg ]; then
            echo "ERROR: /etc/xdg is missing."
            exit 1
          fi

          # --------------------------------------------------------
          # Create RDP user
          # --------------------------------------------------------

          echo "Creating RDP user..."

          if id "$USERNAME" >/dev/null 2>&1; then
            sudo userdel -r "$USERNAME" || true
          fi

          # Linux validates username according to its own rules.
          sudo useradd -m -s /bin/bash "$USERNAME"

          printf '%s:%s\n' "$USERNAME" "$PASSWORD" |
            sudo chpasswd

          sudo usermod -aG sudo "$USERNAME"

          # Use numeric UID in sudoers to avoid username parsing issues.
          USER_UID=$(id -u "$USERNAME")

          sudo rm -f /etc/sudoers.d/90-rdp-user

          printf '#%s ALL=(ALL) NOPASSWD:ALL\n' "$USER_UID" |
            sudo tee /etc/sudoers.d/90-rdp-user >/dev/null

          sudo chmod 0440 /etc/sudoers.d/90-rdp-user

          sudo visudo -cf /etc/sudoers.d/90-rdp-user

          USER_HOME="/home/$USERNAME"

          # --------------------------------------------------------
          # Clean user directories
          # --------------------------------------------------------

          sudo mkdir -p \
            "$USER_HOME/.config" \
            "$USER_HOME/.cache" \
            "$USER_HOME/.local/share"

          sudo rm -rf "$USER_HOME/.cache/sessions"

          sudo chown -R "$USERNAME:$USERNAME" "$USER_HOME"

          sudo chmod 755 "$USER_HOME"

          echo "RDP user created successfully."

      # ============================================================
      # 3. REPAIR AND VERIFY XFCE SYSTEM CONFIGURATION
      # ============================================================

      - name: Repair and verify XFCE configuration
        shell: bash
        env:
          OPENCODE_BASIC_USER: ${{ secrets.OPENCODE_BASIC_USER }}

        run: |
          set -Eeuo pipefail

          USERNAME="$OPENCODE_BASIC_USER"
          USER_HOME="/home/$USERNAME"

          SYSTEM_XML="/etc/xdg/xfce4/xfconf/xfce-perchannel-xml/xfce4-session.xml"

          echo "Checking official XFCE session configuration..."

          # --------------------------------------------------------
          # Reinstall official package if configuration is missing
          # --------------------------------------------------------

          if [ ! -s "$SYSTEM_XML" ]; then

            echo "System XFCE session configuration missing."
            echo "Reinstalling xfce4-session..."

            sudo apt-get install -y --reinstall xfce4-session

          fi

          if [ ! -s "$SYSTEM_XML" ]; then
            echo "ERROR: Official XFCE session XML is missing."
            exit 1
          fi

          # --------------------------------------------------------
          # Validate official XML structure
          # --------------------------------------------------------

          python3 - "$SYSTEM_XML" <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          path = sys.argv[1]

          try:
              root = ET.parse(path).getroot()
          except Exception as exc:
              print("ERROR: Invalid XFCE XML:", exc)
              sys.exit(1)

          if root.tag != "channel":
              print("ERROR: Invalid XFCE channel.")
              sys.exit(1)

          if root.get("name") != "xfce4-session":
              print("ERROR: Incorrect channel name.")
              sys.exit(1)

          def prop(parent, name):
              if parent is None:
                  return None

              for item in parent.findall("property"):
                  if item.get("name") == name:
                      return item

              return None

          general = prop(root, "general")
          failsafe_name = prop(general, "FailsafeSessionName")

          if failsafe_name is None:
              print("ERROR: FailsafeSessionName is missing.")
              sys.exit(1)

          if failsafe_name.get("value") != "Failsafe":
              print("ERROR: Unexpected failsafe session name.")
              sys.exit(1)

          sessions = prop(root, "sessions")
          failsafe = prop(sessions, "Failsafe")

          if failsafe is None:
              print("ERROR: Failsafe session definition missing.")
              sys.exit(1)

          is_failsafe = prop(failsafe, "IsFailsafe")
          count = prop(failsafe, "Count")

          if is_failsafe is None or is_failsafe.get("value") != "true":
              print("ERROR: Failsafe session is not enabled.")
              sys.exit(1)

          if count is None or int(count.get("value", "0")) <= 0:
              print("ERROR: Failsafe session has no applications.")
              sys.exit(1)

          print("Official XFCE XML validated.")
          print("Failsafe session:", failsafe_name.get("value"))
          print("Application count:", count.get("value"))
          PY

          # --------------------------------------------------------
          # Set correct XDG environment
          # --------------------------------------------------------

          echo "Configuring XDG directories..."

          # IMPORTANT:
          # XFCE error explicitly requires /etc.
          # Keep both standard XDG path and /etc.

          XDG_DIRS="/etc/xdg:/etc"

          # --------------------------------------------------------
          # Remove potentially corrupted user session overrides
          # --------------------------------------------------------

          sudo rm -rf "$USER_HOME/.cache/sessions"

          sudo rm -f \
            "$USER_HOME/.config/xfce4/xfconf/xfce-perchannel-xml/xfce4-session.xml"

          # --------------------------------------------------------
          # Configure .xsession
          # --------------------------------------------------------

          sudo tee "$USER_HOME/.xsession" >/dev/null <<'EOF'
          #!/bin/sh

          # Remove inherited session variables.
          unset SESSION_MANAGER
          unset DBUS_SESSION_BUS_ADDRESS
          unset DBUS_STARTER_ADDRESS
          unset DBUS_STARTER_BUS_TYPE
          unset WAYLAND_DISPLAY

          # Correct XFCE configuration paths.
          export XDG_CONFIG_DIRS="/etc/xdg:/etc"

          export XDG_CONFIG_HOME="$HOME/.config"
          export XDG_CACHE_HOME="$HOME/.cache"
          export XDG_DATA_HOME="$HOME/.local/share"

          export XDG_SESSION_TYPE="x11"

          export GDK_BACKEND="x11"

          # Start a fresh D-Bus session and XFCE.
          exec dbus-run-session -- startxfce4
          EOF

          sudo chmod 755 "$USER_HOME/.xsession"

          sudo chown "$USERNAME:$USERNAME" "$USER_HOME/.xsession"

          # --------------------------------------------------------
          # Verify ownership
          # --------------------------------------------------------

          sudo chown -R "$USERNAME:$USERNAME" \
            "$USER_HOME/.config" \
            "$USER_HOME/.cache" \
            "$USER_HOME/.local"

          echo "XFCE startup script created."

          # --------------------------------------------------------
          # Test D-Bus and xfconf as the actual RDP user
          # --------------------------------------------------------

          echo "=========================================="
          echo "Testing XFCE D-Bus configuration"
          echo "=========================================="

          sudo -u "$USERNAME" \
            env \
              HOME="$USER_HOME" \
              XDG_CONFIG_DIRS="$XDG_DIRS" \
              XDG_CONFIG_HOME="$USER_HOME/.config" \
            dbus-run-session -- bash -Eeuo pipefail -c '

              echo "D-Bus address:"
              test -n "$DBUS_SESSION_BUS_ADDRESS"

              echo "Reading XFCE failsafe name..."

              FAILSAFE_NAME=$(
                xfconf-query \
                  -c xfce4-session \
                  -p /general/FailsafeSessionName
              )

              echo "Failsafe name: $FAILSAFE_NAME"

              if [ "$FAILSAFE_NAME" != "Failsafe" ]; then
                echo "ERROR: Invalid failsafe name."
                exit 1
              fi

              echo "Checking failsafe flag..."

              FAILSAFE_FLAG=$(
                xfconf-query \
                  -c xfce4-session \
                  -p "/sessions/$FAILSAFE_NAME/IsFailsafe"
              )

              echo "Failsafe flag: $FAILSAFE_FLAG"

              if [[ "$FAILSAFE_FLAG" != "true" &&
                    "$FAILSAFE_FLAG" != "1" ]]; then
                echo "ERROR: Failsafe flag is invalid."
                exit 1
              fi

              echo "Checking application count..."

              APP_COUNT=$(
                xfconf-query \
                  -c xfce4-session \
                  -p "/sessions/$FAILSAFE_NAME/Count"
              )

              echo "Application count: $APP_COUNT"

              if ! [[ "$APP_COUNT" =~ ^[0-9]+$ ]] ||
                 (( APP_COUNT < 1 )); then
                echo "ERROR: Invalid application count."
                exit 1
              fi

              echo "Checking failsafe application commands..."

              for i in $(seq 0 $((APP_COUNT - 1))); do

                PROPERTY="/sessions/$FAILSAFE_NAME/Client${i}_Command"

                if ! xfconf-query \
                  -c xfce4-session \
                  -p "$PROPERTY" >/dev/null 2>&1; then

                  echo "ERROR: Missing $PROPERTY"
                  exit 1
                fi

              done

              echo "All XFCE configuration checks passed."

            '

          echo "=========================================="
          echo "XFCE + D-Bus verification PASSED"
          echo "=========================================="

      # ============================================================
      # 4. CONFIGURE AND START XRDP
      # ============================================================

      - name: Configure and start XRDP
        shell: bash

        run: |
          set -Eeuo pipefail

          echo "Configuring XRDP..."

          sudo adduser xrdp ssl-cert || true

          if ! dpkg -s xorgxrdp >/dev/null 2>&1; then
            echo "ERROR: xorgxrdp missing."
            exit 1
          fi

          test -f /etc/xrdp/xrdp.ini
          test -f /etc/xrdp/sesman.ini
          test -f /etc/xrdp/startwm.sh

          # Check that Xorg backend exists.
          if ! dpkg -L xorgxrdp | grep -q 'xrdp.*\.so'; then
            echo "ERROR: XRDP Xorg modules missing."
            exit 1
          fi

          sudo systemctl enable xrdp
          sudo systemctl enable xrdp-sesman

          sudo systemctl restart xrdp-sesman
          sudo systemctl restart xrdp

          sleep 5

          for SERVICE in xrdp xrdp-sesman; do

            if ! sudo systemctl is-active --quiet "$SERVICE"; then

              echo "ERROR: $SERVICE failed."

              sudo journalctl \
                -u "$SERVICE" \
                -n 100 \
                --no-pager || true

              exit 1
            fi

          done

          if ! sudo ss -lnt | grep -q ':3389'; then
            echo "ERROR: XRDP is not listening on 3389."
            exit 1
          fi

          echo "XRDP is ready."

      # ============================================================
      # 5. INSTALL BORE
      # ============================================================

      - name: Install Bore and create runner
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

        run: |
          set -Eeuo pipefail

          echo "Fetching latest Bore release..."

          API=$(curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/ekzhang/bore/releases/latest)

          TAG=$(python3 -c \
            "import json,sys; print(json.load(sys.stdin)['tag_name'])" \
            <<< "$API")

          ASSET_URL=$(python3 -c '
          import json,sys

          data=json.load(sys.stdin)

          for asset in data.get("assets", []):
              name=asset["name"]

              if (
                  "x86_64-unknown-linux" in name
                  and name.endswith(".tar.gz")
              ):
                  print(asset["browser_download_url"])
                  break
          ' <<< "$API")

          echo "Bore version: $TAG"

          if [ -z "$ASSET_URL" ]; then
            echo "ERROR: Bore Linux asset not found."
            exit 1
          fi

          rm -f bore bore.tar.gz

          curl -fL "$ASSET_URL" -o bore.tar.gz

          tar -xzf bore.tar.gz

          if [ ! -x ./bore ]; then

            FOUND=$(find . -maxdepth 3 \
              -type f \
              -name bore \
              -executable \
              | head -n 1 || true)

            if [ -z "$FOUND" ]; then
              echo "ERROR: Bore binary not found."
              exit 1
            fi

            cp "$FOUND" ./bore
          fi

          chmod +x ./bore

          ./bore --version || true

          # --------------------------------------------------------
          # Bore runner
          # --------------------------------------------------------

          cat > bore_runner.sh <<'EOF'
          #!/usr/bin/env bash

          set -u

          BORE_BIN="./bore"
          TUNNEL_HOST="bore.pub"

          OUT_LOG="bore_out.log"
          PID_FILE="bore.pid"

          start_bore() {

              echo "Starting Bore tunnel..."

              if [ -f "$PID_FILE" ]; then

                  OLD_PID=$(cat "$PID_FILE" 2>/dev/null || true)

                  if [[ "$OLD_PID" =~ ^[0-9]+$ ]]; then
                      kill "$OLD_PID" 2>/dev/null || true
                  fi

              fi

              : > "$OUT_LOG"

              nohup "$BORE_BIN" local 3389 \
                  --to "$TUNNEL_HOST" \
                  > "$OUT_LOG" 2>&1 &

              BORE_PID=$!

              echo "$BORE_PID" > "$PID_FILE"

              for i in $(seq 1 30); do

                  if ! kill -0 "$BORE_PID" 2>/dev/null; then
                      echo "ERROR: Bore exited."
                      cat "$OUT_LOG" || true
                      return 1
                  fi

                  CLEAN=$(sed -r \
                      's/\x1b\[[0-9;]*m//g' \
                      "$OUT_LOG" 2>/dev/null || true)

                  ENDPOINT=$(echo "$CLEAN" |
                      grep -Eo 'listening at [^[:space:]]+:[0-9]+' |
                      tail -n 1 |
                      awk '{print $3}' || true)

                  if [ -n "$ENDPOINT" ]; then

                      HOST="${ENDPOINT%:*}"
                      PORT="${ENDPOINT##*:}"

                      if [[ "$PORT" =~ ^[0-9]+$ ]]; then

                          TMP_FILE="connection.txt.tmp"

                          printf 'host=%s\nport=%s\n' \
                              "$HOST" "$PORT" > "$TMP_FILE"

                          mv "$TMP_FILE" connection.txt

                          echo "================================"
                          echo "BORE TUNNEL ESTABLISHED"
                          echo "Host: $HOST"
                          echo "Port: $PORT"
                          echo "================================"

                          return 0
                      fi

                  fi

                  sleep 1

              done

              echo "ERROR: Bore startup timed out."

              cat "$OUT_LOG" || true

              kill "$BORE_PID" 2>/dev/null || true

              return 1
          }

          if ! start_bore; then
              echo "Initial Bore startup failed."
              exit 1
          fi

          while true; do

              sleep 15

              CURRENT_PID=$(cat "$PID_FILE" 2>/dev/null || true)

              if [[ ! "$CURRENT_PID" =~ ^[0-9]+$ ]] ||
                 ! kill -0 "$CURRENT_PID" 2>/dev/null; then

                  echo "Bore disconnected. Restarting..."

                  rm -f connection.txt

                  if ! start_bore; then
                      echo "Bore restart failed."
                      sleep 10
                  fi

              fi

          done
          EOF

          chmod +x bore_runner.sh

          echo "Bore runner created."

      # ============================================================
      # 6. START BORE
      # ============================================================

      - name: Start Bore tunnel
        shell: bash

        run: |
          set -Eeuo pipefail

          rm -f connection.txt connection.txt.tmp
          rm -f bore.pid bore_out.log bore_runner.log

          nohup ./bore_runner.sh \
            > bore_runner.log 2>&1 &

          echo $! > bore_runner.pid

          echo "Waiting for tunnel..."

          READY=0

          for i in $(seq 1 60); do

            if [ -f connection.txt ]; then

              HOST=$(grep '^host=' connection.txt |
                cut -d= -f2)

              PORT=$(grep '^port=' connection.txt |
                cut -d= -f2)

              if [ -n "$HOST" ] && [ -n "$PORT" ]; then
                READY=1
                break
              fi

            fi

            RUNNER_PID=$(cat bore_runner.pid)

            if ! kill -0 "$RUNNER_PID" 2>/dev/null; then
              echo "ERROR: Bore runner stopped."
              cat bore_runner.log || true
              exit 1
            fi

            sleep 1

          done

          if [ "$READY" -ne 1 ]; then

            echo "ERROR: Bore tunnel unavailable."

            cat bore_runner.log || true
            cat bore_out.log || true

            exit 1
          fi

          echo "Tunnel ready:"
          cat connection.txt

      # ============================================================
      # 7. FINAL XFCE VERIFICATION
      # ============================================================

      - name: Final XFCE and XRDP verification
        shell: bash
        env:
          OPENCODE_BASIC_USER: ${{ secrets.OPENCODE_BASIC_USER }}

        run: |
          set -Eeuo pipefail

          USERNAME="$OPENCODE_BASIC_USER"

          echo "Final desktop verification..."

          # --------------------------------------------------------
          # Check user session file
          # --------------------------------------------------------

          test -x "/home/$USERNAME/.xsession"

          grep -q 'XDG_CONFIG_DIRS="/etc/xdg:/etc"' \
            "/home/$USERNAME/.xsession"

          grep -q 'dbus-run-session -- startxfce4' \
            "/home/$USERNAME/.xsession"

          # --------------------------------------------------------
          # Test XFCE configuration again
          # --------------------------------------------------------

          sudo -u "$USERNAME" \
            env \
              HOME="/home/$USERNAME" \
              XDG_CONFIG_DIRS="/etc/xdg:/etc" \
            dbus-run-session -- bash -e -c '

              NAME=$(xfconf-query \
                -c xfce4-session \
                -p /general/FailsafeSessionName)

              test "$NAME" = "Failsafe"

              FLAG=$(xfconf-query \
                -c xfce4-session \
                -p "/sessions/$NAME/IsFailsafe")

              [[ "$FLAG" == "true" || "$FLAG" == "1" ]]

              echo "XFCE Failsafe configuration: OK"
            '

          # --------------------------------------------------------
          # Check XRDP
          # --------------------------------------------------------

          sudo systemctl is-active --quiet xrdp
          sudo systemctl is-active --quiet xrdp-sesman

          sudo ss -lnt | grep ':3389'

          echo "=========================================="
          echo "ALL DESKTOP CHECKS PASSED"
          echo "=========================================="

      # ============================================================
      # 8. UPDATE README
      # ============================================================

      - name: Update README.md
        shell: bash
        env:
          OPENCODE_BASIC_USER: ${{ secrets.OPENCODE_BASIC_USER }}
          SESSION_MINUTES: ${{ github.event.inputs.session_minutes }}

        run: |
          set -Eeuo pipefail

          test -f connection.txt

          HOST=$(grep '^host=' connection.txt | cut -d= -f2)
          PORT=$(grep '^port=' connection.txt | cut -d= -f2)

          CONNECTION_STRING="${HOST}:${PORT}"

          EXPIRY=$(date -u \
            -d "+${SESSION_MINUTES} minutes" \
            '+%Y-%m-%d %H:%M:%S UTC')

          TMP_SECTION=$(mktemp)
          TMP_README=$(mktemp)

          cat > "$TMP_SECTION" <<EOF
          ## Ubuntu RDP Access

          **Connection Address:** \`$CONNECTION_STRING\`

          **Username:** \`$OPENCODE_BASIC_USER\`

          **Password:** (stored in GitHub Secrets: \`OPENCODE_BASIC_PASS\`)

          **Expires:** $EXPIRY

          EOF

          if [ ! -f README.md ]; then
            touch README.md
          fi

          if grep -q '^## Ubuntu RDP Access' README.md; then

            awk '
              /^## Ubuntu RDP Access/ { exit }
              { print }
            ' README.md > "$TMP_README"

          else

            cat README.md > "$TMP_README"

          fi

          printf '\n' >> "$TMP_README"

          cat "$TMP_SECTION" >> "$TMP_README"

          mv "$TMP_README" README.md

          rm -f "$TMP_SECTION"

          echo "README updated."

      # ============================================================
      # 9. COMMIT README
      # ============================================================

      - name: Commit and push README
        shell: bash

        run: |
          set -Eeuo pipefail

          git config user.name "github-actions[bot]"

          git config user.email \
            "github-actions[bot]@users.noreply.github.com"

          git add README.md

          if git diff --cached --quiet; then
            echo "README has no changes."
          else
            git commit -m "Update RDP access info [skip ci]"
            git push
          fi

      # ============================================================
      # 10. DISPLAY CONNECTION
      # ============================================================

      - name: Display connection info
        shell: bash
        env:
          OPENCODE_BASIC_USER: ${{ secrets.OPENCODE_BASIC_USER }}

        run: |
          set -Eeuo pipefail

          HOST=$(grep '^host=' connection.txt | cut -d= -f2)
          PORT=$(grep '^port=' connection.txt | cut -d= -f2)

          echo ""
          echo "=================================================="
          echo "             UBUNTU RDP READY"
          echo "=================================================="
          echo ""
          echo "Host:     $HOST"
          echo "Port:     $PORT"
          echo "Username: $OPENCODE_BASIC_USER"
          echo "Password: GitHub Secret OPENCODE_BASIC_PASS"
          echo ""
          echo "Microsoft Remote Desktop:"
          echo "PC Name: $HOST:$PORT"
          echo "Username: $OPENCODE_BASIC_USER"
          echo ""
          echo "=================================================="

      # ============================================================
      # 11. KEEP SESSION ALIVE
      # ============================================================

      - name: Keep session alive
        shell: bash
        env:
          SESSION_MINUTES: ${{ github.event.inputs.session_minutes }}

        run: |
          set -Eeuo pipefail

          DURATION="$SESSION_MINUTES"

          END_TIME=$(( $(date +%s) + DURATION * 60 ))

          echo "Session duration: $DURATION minutes."

          while [ "$(date +%s)" -lt "$END_TIME" ]; do

            NOW=$(date +%s)

            REMAIN=$(( END_TIME - NOW ))

            HOURS=$(( REMAIN / 3600 ))
            MINUTES=$(( (REMAIN % 3600) / 60 ))
            SECONDS=$(( REMAIN % 60 ))

            printf \
              'Remaining %02d:%02d:%02d | UTC: %s\n' \
              "$HOURS" \
              "$MINUTES" \
              "$SECONDS" \
              "$(date -u +%H:%M:%S)"

            # Keep XRDP active.
            if ! sudo systemctl is-active --quiet xrdp; then

              echo "WARNING: XRDP stopped. Restarting..."

              sudo systemctl restart xrdp

            fi

            # Keep Bore runner active.
            if [ ! -f bore_runner.pid ]; then
              echo "ERROR: Bore PID file missing."
              exit 1
            fi

            RUNNER_PID=$(cat bore_runner.pid)

            if ! kill -0 "$RUNNER_PID" 2>/dev/null; then
              echo "ERROR: Bore runner stopped."
              cat bore_runner.log || true
              exit 1
            fi

            sleep 30

          done

          echo "Session duration completed."

      # ============================================================
      # 12. CLEANUP
      # ============================================================

      - name: Cleanup
        if: always()
        shell: bash

        run: |
          echo "Cleaning up..."

          if [ -f bore.pid ]; then

            BORE_PID=$(cat bore.pid)

            if [[ "$BORE_PID" =~ ^[0-9]+$ ]]; then
              kill "$BORE_PID" 2>/dev/null || true
            fi

          fi

          if [ -f bore_runner.pid ]; then

            RUNNER_PID=$(cat bore_runner.pid)

            if [[ "$RUNNER_PID" =~ ^[0-9]+$ ]]; then
              kill "$RUNNER_PID" 2>/dev/null || true
            fi

          fi

          sudo systemctl stop xrdp 2>/dev/null || true
          sudo systemctl stop xrdp-sesman 2>/dev/null || true

          echo "Cleanup completed."
