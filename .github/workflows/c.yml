
name: Ubuntu RDP with bore (Auto-Update README)

on:
  workflow_dispatch:
    inputs:
      session_minutes:
        description: 'Duration in minutes'
        required: true
        default: '120'

permissions:
  contents: write

concurrency:
  group: ubuntu-rdp-session
  cancel-in-progress: true

jobs:
  rdp-tunnel:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      DEBIAN_FRONTEND: noninteractive

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # ============================================================
      # 2. INSTALL PACKAGES AND CREATE USER
      # ============================================================

      - name: Install XFCE XRDP and dependencies
        shell: bash
        env:
          OPENCODE_BASIC_USER: ${{ secrets.OPENCODE_BASIC_USER }}
          OPENCODE_BASIC_PASS: ${{ secrets.OPENCODE_BASIC_PASS }}
          SESSION_MINUTES: ${{ github.event.inputs.session_minutes }}

        run: |
          set -Eeuo pipefail

          echo "=========================================="
          echo "Installing Ubuntu RDP environment"
          echo "=========================================="

          if ! [[ "$SESSION_MINUTES" =~ ^[0-9]+$ ]] ||
             (( SESSION_MINUTES < 1 || SESSION_MINUTES > 330 )); then
            echo "ERROR: Invalid session duration."
            exit 1
          fi

          USERNAME="$OPENCODE_BASIC_USER"
          PASSWORD="$OPENCODE_BASIC_PASS"

          if [ -z "$USERNAME" ] || [ -z "$PASSWORD" ]; then
            echo "ERROR: RDP credentials are missing."
            exit 1
          fi

          sudo apt-get update -qq

          sudo apt-get install -y \
            xfce4 \
            xfce4-goodies \
            xfce4-session \
            xfconf \
            xfce4-settings \
            xfce4-panel \
            xfdesktop4 \
            xfwm4 \
            thunar \
            xrdp \
            xorgxrdp \
            xserver-xorg-core \
            dbus \
            dbus-x11 \
            dbus-user-session \
            xauth \
            x11-xserver-utils \
            xterm \
            curl \
            wget \
            ca-certificates \
            python3 \
            tar \
            gzip

          echo "Package installation completed."

          # --------------------------------------------------------
          # Validate required commands
          # --------------------------------------------------------

          for BIN in \
            startxfce4 \
            xfce4-session \
            xfconf-query \
            dbus-run-session \
            Xorg \
            xfwm4 \
            xfce4-panel \
            xfdesktop; do

            if ! command -v "$BIN" >/dev/null 2>&1; then
              echo "ERROR: Missing executable: $BIN"
              exit 1
            fi

          done

          # --------------------------------------------------------
          # IMPORTANT:
          # xfconfd is not necessarily in PATH.
          # Find it through the installed package database.
          # --------------------------------------------------------

          echo "Locating xfconfd..."

          XFCONFD_PATH=$(
            dpkg-query -L xfconf |
            grep -E '/xfconfd$' |
            head -n 1 || true
          )

          if [ -z "$XFCONFD_PATH" ] ||
             [ ! -x "$XFCONFD_PATH" ]; then

            echo "ERROR: xfconfd binary is missing."

            dpkg-query -L xfconf || true

            exit 1
          fi

          echo "xfconfd found:"
          echo "$XFCONFD_PATH"

          # --------------------------------------------------------
          # Validate username through Linux useradd
          # Do not use an unnecessarily restrictive regex.
          # --------------------------------------------------------

          if id "$USERNAME" >/dev/null 2>&1; then
            sudo userdel -r "$USERNAME" || true
          fi

          sudo useradd -m -s /bin/bash "$USERNAME"

          printf '%s:%s\n' "$USERNAME" "$PASSWORD" |
            sudo chpasswd

          sudo usermod -aG sudo "$USERNAME"

          USER_HOME="/home/$USERNAME"

          sudo mkdir -p \
            "$USER_HOME/.config" \
            "$USER_HOME/.cache" \
            "$USER_HOME/.local/share"

          sudo chown -R "$USERNAME:$USERNAME" "$USER_HOME"

          sudo chmod 755 "$USER_HOME"

          echo "RDP user created successfully."

      # ============================================================
      # 3. REPAIR XFCE SYSTEM CONFIGURATION
      # ============================================================

      - name: Repair XFCE configuration
        shell: bash
        env:
          OPENCODE_BASIC_USER: ${{ secrets.OPENCODE_BASIC_USER }}

        run: |
          set -Eeuo pipefail

          USERNAME="$OPENCODE_BASIC_USER"
          USER_HOME="/home/$USERNAME"

          SYSTEM_XML="/etc/xdg/xfce4/xfconf/xfce-perchannel-xml/xfce4-session.xml"

          echo "Checking official XFCE configuration..."

          # --------------------------------------------------------
          # Reinstall official XFCE session package if necessary
          # --------------------------------------------------------

          if [ ! -s "$SYSTEM_XML" ]; then

            echo "XFCE configuration missing."
            echo "Reinstalling xfce4-session..."

            sudo apt-get install -y --reinstall xfce4-session

          fi

          if [ ! -s "$SYSTEM_XML" ]; then
            echo "ERROR: Official XFCE XML is missing."
            exit 1
          fi

          # --------------------------------------------------------
          # Validate official XML
          # --------------------------------------------------------

          python3 - "$SYSTEM_XML" <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          path = sys.argv[1]

          try:
              root = ET.parse(path).getroot()
          except Exception as exc:
              print("ERROR: Invalid XFCE XML:", exc)
              sys.exit(1)

          if root.tag != "channel":
              sys.exit("ERROR: Invalid channel.")

          if root.get("name") != "xfce4-session":
              sys.exit("ERROR: Incorrect channel.")

          def get_property(parent, name):
              if parent is None:
                  return None

              for item in parent.findall("property"):
                  if item.get("name") == name:
                      return item

              return None

          general = get_property(root, "general")

          failsafe = get_property(
              general,
              "FailsafeSessionName"
          )

          if failsafe is None or failsafe.get("value") != "Failsafe":
              sys.exit("ERROR: FailsafeSessionName missing or invalid.")

          sessions = get_property(root, "sessions")

          session = get_property(sessions, "Failsafe")

          if session is None:
              sys.exit("ERROR: Failsafe session missing.")

          flag = get_property(session, "IsFailsafe")
          count = get_property(session, "Count")

          if flag is None or flag.get("value") != "true":
              sys.exit("ERROR: Failsafe flag is invalid.")

          if count is None:
              sys.exit("ERROR: Failsafe application count missing.")

          try:
              number = int(count.get("value", "0"))
          except ValueError:
              sys.exit("ERROR: Invalid application count.")

          if number < 1 or number > 100:
              sys.exit("ERROR: Invalid application count.")

          for i in range(number):
              command = get_property(
                  session,
                  f"Client{i}_Command"
              )

              if command is None:
                  sys.exit(f"ERROR: Client{i}_Command missing.")

              values = command.findall("value")

              if not values:
                  sys.exit(f"ERROR: Client{i}_Command is empty.")

          print("Official XFCE XML validated.")
          print("Failsafe session:", failsafe.get("value"))
          print("Application count:", number)
          PY

          # --------------------------------------------------------
          # Correct XDG configuration directories
          # --------------------------------------------------------

          XDG_DIRS="/etc/xdg:/etc"

          # --------------------------------------------------------
          # Remove broken user session cache and overrides
          # --------------------------------------------------------

          sudo rm -rf "$USER_HOME/.cache/sessions"

          sudo rm -f \
            "$USER_HOME/.config/xfce4/xfconf/xfce-perchannel-xml/xfce4-session.xml"

          # --------------------------------------------------------
          # Create clean XFCE session startup
          # --------------------------------------------------------

          sudo tee "$USER_HOME/.xsession" >/dev/null <<'EOF'
          #!/bin/sh

          unset SESSION_MANAGER
          unset DBUS_SESSION_BUS_ADDRESS
          unset DBUS_STARTER_ADDRESS
          unset DBUS_STARTER_BUS_TYPE
          unset WAYLAND_DISPLAY

          export XDG_CONFIG_DIRS="/etc/xdg:/etc"

          export XDG_CONFIG_HOME="$HOME/.config"
          export XDG_CACHE_HOME="$HOME/.cache"
          export XDG_DATA_HOME="$HOME/.local/share"

          export XDG_SESSION_TYPE="x11"
          export XDG_CURRENT_DESKTOP="XFCE"
          export XDG_SESSION_DESKTOP="xfce"
          export DESKTOP_SESSION="xfce"

          export GDK_BACKEND="x11"

          exec dbus-run-session -- startxfce4
          EOF

          sudo chmod 755 "$USER_HOME/.xsession"

          sudo chown "$USERNAME:$USERNAME" \
            "$USER_HOME/.xsession"

          sudo chown -R "$USERNAME:$USERNAME" \
            "$USER_HOME/.config" \
            "$USER_HOME/.cache" \
            "$USER_HOME/.local"

          echo "XFCE startup configured."

      # ============================================================
      # 4. TEST D-BUS AND XFCONF
      # ============================================================

      - name: Verify XFCE D-Bus and Failsafe
        shell: bash
        env:
          OPENCODE_BASIC_USER: ${{ secrets.OPENCODE_BASIC_USER }}

        run: |
          set -Eeuo pipefail

          USERNAME="$OPENCODE_BASIC_USER"
          USER_HOME="/home/$USERNAME"

          echo "=========================================="
          echo "Testing XFCE D-Bus configuration"
          echo "=========================================="

          sudo -u "$USERNAME" \
            env \
              HOME="$USER_HOME" \
              XDG_CONFIG_DIRS="/etc/xdg:/etc" \
              XDG_CONFIG_HOME="$USER_HOME/.config" \
              XDG_CACHE_HOME="$USER_HOME/.cache" \
            dbus-run-session -- bash -Eeuo pipefail -c '

              echo "D-Bus session:"
              test -n "$DBUS_SESSION_BUS_ADDRESS"

              echo "Checking xfconf..."

              FAILSAFE_NAME=$(
                xfconf-query \
                  -c xfce4-session \
                  -p /general/FailsafeSessionName
              )

              echo "Failsafe name: $FAILSAFE_NAME"

              if [ "$FAILSAFE_NAME" != "Failsafe" ]; then
                echo "ERROR: Incorrect Failsafe name."
                exit 1
              fi

              FAILSAFE_FLAG=$(
                xfconf-query \
                  -c xfce4-session \
                  -p /sessions/Failsafe/IsFailsafe
              )

              echo "Failsafe flag: $FAILSAFE_FLAG"

              if [[ "$FAILSAFE_FLAG" != "true" &&
                    "$FAILSAFE_FLAG" != "1" ]]; then

                echo "ERROR: Failsafe flag is disabled."
                exit 1
              fi

              APP_COUNT=$(
                xfconf-query \
                  -c xfce4-session \
                  -p /sessions/Failsafe/Count
              )

              echo "Application count: $APP_COUNT"

              if ! [[ "$APP_COUNT" =~ ^[0-9]+$ ]] ||
                 (( APP_COUNT < 1 || APP_COUNT > 100 )); then

                echo "ERROR: Invalid application count."
                exit 1
              fi

              for i in $(seq 0 $((APP_COUNT - 1))); do

                PROPERTY="/sessions/Failsafe/Client${i}_Command"

                if ! xfconf-query \
                  -c xfce4-session \
                  -p "$PROPERTY" >/dev/null 2>&1; then

                  echo "ERROR: Missing $PROPERTY"
                  exit 1
                fi

              done

              echo "xfconf configuration verified."
            '

          echo "=========================================="
          echo "XFCE D-BUS TEST PASSED"
          echo "=========================================="

      # ============================================================
      # 5. CONFIGURE XRDP
      # ============================================================

      - name: Configure and start XRDP
        shell: bash

        run: |
          set -Eeuo pipefail

          echo "Configuring XRDP..."

          sudo adduser xrdp ssl-cert || true

          if ! dpkg -s xorgxrdp >/dev/null 2>&1; then
            echo "ERROR: xorgxrdp missing."
            exit 1
          fi

          for FILE in \
            /etc/xrdp/xrdp.ini \
            /etc/xrdp/sesman.ini \
            /etc/xrdp/startwm.sh; do

            if [ ! -s "$FILE" ]; then
              echo "ERROR: Missing $FILE"
              exit 1
            fi

          done

          sudo systemctl enable xrdp
          sudo systemctl enable xrdp-sesman

          sudo systemctl restart xrdp-sesman
          sudo systemctl restart xrdp

          sleep 5

          for SERVICE in xrdp xrdp-sesman; do

            if ! sudo systemctl is-active --quiet "$SERVICE"; then

              echo "ERROR: $SERVICE failed."

              sudo journalctl \
                -u "$SERVICE" \
                -n 100 \
                --no-pager || true

              exit 1
            fi

          done

          if ! sudo ss -lnt | grep -q ':3389'; then
            echo "ERROR: XRDP is not listening on port 3389."
            exit 1
          fi

          echo "XRDP is ready."

      # ============================================================
      # 6. DOWNLOAD BORE
      # ============================================================

      - name: Install Bore
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

        run: |
          set -Eeuo pipefail

          echo "Fetching latest Bore release..."

          API=$(
            curl -fsSL \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              https://api.github.com/repos/ekzhang/bore/releases/latest
          )

          TAG=$(python3 -c \
            "import json,sys; print(json.load(sys.stdin)['tag_name'])" \
            <<< "$API")

          ASSET_URL=$(python3 -c '
          import json
          import sys

          data = json.load(sys.stdin)

          for asset in data.get("assets", []):
              name = asset["name"]

              if (
                  "x86_64-unknown-linux" in name
                  and name.endswith(".tar.gz")
              ):
                  print(asset["browser_download_url"])
                  break
          ' <<< "$API")

          echo "Bore version: $TAG"

          if [ -z "$ASSET_URL" ]; then
            echo "ERROR: Suitable Bore asset not found."
            exit 1
          fi

          rm -f bore bore.tar.gz

          curl -fL "$ASSET_URL" -o bore.tar.gz

          tar -xzf bore.tar.gz

          if [ ! -f ./bore ]; then

            FOUND=$(
              find . -maxdepth 3 \
                -type f \
                -name bore |
              head -n 1 || true
            )

            if [ -z "$FOUND" ]; then
              echo "ERROR: Bore executable not found."
              exit 1
            fi

            cp "$FOUND" ./bore
          fi

          chmod +x ./bore

          echo "Bore version:"
          ./bore --version

          echo "Bore installed successfully."

      # ============================================================
      # 7. START BORE TUNNEL
      # ============================================================

      - name: Start Bore tunnel
        shell: bash

        run: |
          set -Eeuo pipefail

          rm -f connection.txt bore.pid bore_out.log

          echo "Starting Bore..."

          # Remove GitHub Actions process tracking variable.
          # This allows the detached process to survive the step.

          env -u RUNNER_TRACKING_ID \
            nohup ./bore local 3389 \
              --to bore.pub \
              > bore_out.log 2>&1 \
              </dev/null &

          BORE_PID=$!

          echo "$BORE_PID" > bore.pid

          echo "Bore PID: $BORE_PID"

          READY=0

          for i in $(seq 1 60); do

            if ! kill -0 "$BORE_PID" 2>/dev/null; then
              echo "ERROR: Bore exited unexpectedly."
              cat bore_out.log || true
              exit 1
            fi

            CLEAN=$(sed -r \
              's/\x1b\[[0-9;]*m//g' \
              bore_out.log || true)

            PORT=$(
              echo "$CLEAN" |
              sed -nE \
                's/.*listening at bore\.pub:([0-9]+).*/\1/p' |
              tail -n 1
            )

            if [[ "$PORT" =~ ^[0-9]+$ ]] &&
               (( PORT >= 1 && PORT <= 65535 )); then

              printf 'host=%s\nport=%s\n' \
                "bore.pub" "$PORT" > connection.txt

              READY=1

              break
            fi

            sleep 1

          done

          if [ "$READY" -ne 1 ]; then

            echo "ERROR: Bore tunnel startup timed out."

            cat bore_out.log || true

            exit 1
          fi

          echo "=========================================="
          echo "BORE TUNNEL ESTABLISHED"
          echo "=========================================="

          cat connection.txt

      # ============================================================
      # 8. FINAL DESKTOP VERIFICATION
      # ============================================================

      - name: Final XFCE and XRDP verification
        shell: bash
        env:
          OPENCODE_BASIC_USER: ${{ secrets.OPENCODE_BASIC_USER }}

        run: |
          set -Eeuo pipefail

          USERNAME="$OPENCODE_BASIC_USER"

          echo "Performing final verification..."

          # Check session script.

          test -x "/home/$USERNAME/.xsession"

          grep -q 'XDG_CONFIG_DIRS="/etc/xdg:/etc"' \
            "/home/$USERNAME/.xsession"

          grep -q 'dbus-run-session -- startxfce4' \
            "/home/$USERNAME/.xsession"

          # Check system configuration.

          test -s \
            /etc/xdg/xfce4/xfconf/xfce-perchannel-xml/xfce4-session.xml

          # Check D-Bus and XFConf one more time.

          sudo -u "$USERNAME" \
            env \
              HOME="/home/$USERNAME" \
              XDG_CONFIG_DIRS="/etc/xdg:/etc" \
            dbus-run-session -- bash -Eeuo pipefail -c '

              NAME=$(xfconf-query \
                -c xfce4-session \
                -p /general/FailsafeSessionName)

              test "$NAME" = "Failsafe"

              FLAG=$(xfconf-query \
                -c xfce4-session \
                -p "/sessions/$NAME/IsFailsafe")

              [[ "$FLAG" == "true" || "$FLAG" == "1" ]]

              echo "XFCE Failsafe configuration: OK"
            '

          # Check XRDP services.

          sudo systemctl is-active --quiet xrdp
          sudo systemctl is-active --quiet xrdp-sesman

          sudo ss -lnt | grep ':3389'

          # Check Bore.

          test -s connection.txt

          BORE_PID=$(cat bore.pid)

          kill -0 "$BORE_PID"

          echo "=========================================="
          echo "ALL CHECKS PASSED"
          echo "=========================================="

      # ============================================================
      # 9. UPDATE README
      # ============================================================

      - name: Update README.md
        shell: bash
        env:
          OPENCODE_BASIC_USER: ${{ secrets.OPENCODE_BASIC_USER }}
          SESSION_MINUTES: ${{ github.event.inputs.session_minutes }}

        run: |
          set -Eeuo pipefail

          test -s connection.txt

          HOST=$(grep '^host=' connection.txt | cut -d= -f2)
          PORT=$(grep '^port=' connection.txt | cut -d= -f2)

          CONNECTION_STRING="${HOST}:${PORT}"

          EXPIRY=$(date -u \
            -d "+${SESSION_MINUTES} minutes" \
            '+%Y-%m-%d %H:%M:%S UTC')

          export HOST PORT EXPIRY

          python3 <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path("README.md")

          host = os.environ["HOST"]
          port = os.environ["PORT"]
          expiry = os.environ["EXPIRY"]
          username = os.environ["OPENCODE_BASIC_USER"]

          section = f"""## Ubuntu RDP Access

          **Connection Address:** `{host}:{port}`

          **Username:** `{username}`

          **Password:** (stored in GitHub Secrets: `OPENCODE_BASIC_PASS`)

          **Expires:** {expiry}
          """

          section = "\n".join(
              line.lstrip() for line in section.splitlines()
          ).strip()

          original = path.read_text() if path.exists() else ""

          pattern = r"(?m)^## Ubuntu RDP Access[ \t]*\n"

          match = re.search(pattern, original)

          if match:
              next_heading = re.search(
                  r"(?m)^## (?!Ubuntu RDP Access)[^\n]*",
                  original[match.end():]
              )

              if next_heading:
                  end = match.end() + next_heading.start()
              else:
                  end = len(original)

              result = (
                  original[:match.start()]
                  + section
                  + "\n\n"
                  + original[end:].lstrip("\n")
              )

          else:
              result = original.rstrip()

              if result:
                  result += "\n\n"

              result += section + "\n"

          path.write_text(result)

          print("README.md updated successfully.")
          PY

      # ============================================================
      # 10. COMMIT AND PUSH
      # ============================================================

      - name: Commit and push README
        shell: bash

        run: |
          set -Eeuo pipefail

          git config user.name "github-actions[bot]"

          git config user.email \
            "github-actions[bot]@users.noreply.github.com"

          git add README.md

          if git diff --cached --quiet; then

            echo "README has no changes."

          else

            git commit -m "Update RDP access info [skip ci]"

            git push

          fi

      # ============================================================
      # 11. DISPLAY CONNECTION INFORMATION
      # ============================================================

      - name: Display connection information
        shell: bash
        env:
          OPENCODE_BASIC_USER: ${{ secrets.OPENCODE_BASIC_USER }}

        run: |
          set -Eeuo pipefail

          HOST=$(grep '^host=' connection.txt | cut -d= -f2)
          PORT=$(grep '^port=' connection.txt | cut -d= -f2)

          echo ""
          echo "=================================================="
          echo "             UBUNTU RDP READY"
          echo "=================================================="
          echo ""
          echo "Host:     $HOST"
          echo "Port:     $PORT"
          echo "Username: $OPENCODE_BASIC_USER"
          echo "Password: GitHub Secret OPENCODE_BASIC_PASS"
          echo ""
          echo "Microsoft Remote Desktop:"
          echo "PC Name: $HOST:$PORT"
          echo "Username: $OPENCODE_BASIC_USER"
          echo ""
          echo "=================================================="

      # ============================================================
      # 12. KEEP SESSION ALIVE
      # ============================================================

      - name: Keep session alive
        shell: bash
        env:
          SESSION_MINUTES: ${{ github.event.inputs.session_minutes }}

        run: |
          set -Eeuo pipefail

          DURATION="$SESSION_MINUTES"

          END_TIME=$(( $(date +%s) + DURATION * 60 ))

          echo "Session duration: $DURATION minutes."

          BORE_PID=$(cat bore.pid)

          while [ "$(date +%s)" -lt "$END_TIME" ]; do

            NOW=$(date +%s)

            REMAIN=$(( END_TIME - NOW ))

            HOURS=$(( REMAIN / 3600 ))
            MINUTES=$(( (REMAIN % 3600) / 60 ))
            SECONDS=$(( REMAIN % 60 ))

            printf \
              'Remaining %02d:%02d:%02d | UTC: %s\n' \
              "$HOURS" \
              "$MINUTES" \
              "$SECONDS" \
              "$(date -u +%H:%M:%S)"

            # Bore monitoring.

            if ! kill -0 "$BORE_PID" 2>/dev/null; then

              echo "ERROR: Bore tunnel stopped."

              cat bore_out.log || true

              exit 1
            fi

            # XRDP monitoring.

            if ! sudo systemctl is-active --quiet xrdp; then

              echo "WARNING: XRDP stopped. Restarting..."

              sudo systemctl restart xrdp

              sleep 3

              sudo systemctl is-active --quiet xrdp

            fi

            if ! sudo systemctl is-active --quiet xrdp-sesman; then

              echo "WARNING: XRDP sesman stopped. Restarting..."

              sudo systemctl restart xrdp-sesman

              sleep 3

              sudo systemctl is-active --quiet xrdp-sesman

            fi

            sleep 30

          done

          echo "Session duration completed."

      # ============================================================
      # 13. CLEANUP
      # ============================================================

      - name: Cleanup
        if: always()
        shell: bash

        run: |
          echo "Cleaning up..."

          if [ -f bore.pid ]; then

            BORE_PID=$(cat bore.pid)

            if [[ "$BORE_PID" =~ ^[0-9]+$ ]]; then

              kill "$BORE_PID" 2>/dev/null || true

            fi

          fi

          sudo systemctl stop xrdp 2>/dev/null || true

          sudo systemctl stop xrdp-sesman 2>/dev/null || true

          echo "Cleanup completed."
